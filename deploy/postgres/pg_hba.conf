# Clash Lens database login rules. The database container starts PostgreSQL
# with hba_file pointing here, so the cluster's own pg_hba.conf, whose
# defaults let 127.0.0.1 and ::1 in without a password, is never read.
#
# TYPE  DATABASE     USER  ADDRESS  METHOD
# The Unix socket exists only inside the database container. ./ops, health
# checks and backups use it there; no other container can reach it.
local   all          all            trust
local   replication  all            trust
# Every network connection, including the other containers sharing the pod's
# 127.0.0.1 and ::1, must give its own role's password.
host    all          all   all      scram-sha-256
host    replication  all   all      scram-sha-256
