name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  go:
    name: Go build, vet, and short tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
      - name: Cache embedded PostgreSQL binaries
        uses: actions/cache@v4
        with:
          path: ~/.embedded-postgres-go
          key: embedded-postgres-go-${{ runner.os }}
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      # Short mode skips the embedded-PostgreSQL and focused Go→Python seam;
      # the postgres job below owns those and installs uv there.
      - name: Test
        run: go test -short -count=1 ./...

  python:
    name: Python lint, compile, and PostgreSQL tests
    runs-on: ubuntu-latest
    # One locked environment for every uv step in this job: sync, Ruff,
    # compile, and the tests must all resolve the same environment.
    env:
      CLASHLENS_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/clashlens
      UV_PROJECT_ENVIRONMENT: /tmp/clashlens-ci-venv
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: clashlens
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d clashlens"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Sync locked dependencies
        working-directory: python
        run: uv sync --locked
      - name: Ruff
        working-directory: python
        run: uv run ruff check . ../scripts/*.py
      - name: Compile
        working-directory: python
        run: uv run python -m compileall -q src
      - name: Tests
        working-directory: python
        run: uv run pytest -q
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
      - name: Performance runner tests
        working-directory: python
        run: $UV_PROJECT_ENVIRONMENT/bin/python ../scripts/test_performance_runner.py -v

  postgres:
    name: Go collector suite on embedded PostgreSQL (includes focused Go→Python seam)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Cache embedded PostgreSQL binaries
        uses: actions/cache@v4
        with:
          path: ~/.embedded-postgres-go
          key: embedded-postgres-go-${{ runner.os }}
      - name: Go collector suite with embedded PostgreSQL
        run: go test ./internal/collector -count=1 -v -timeout=1200s

  deploy-shell:
    name: Deployment shell seam
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deployment command seam
        run: bash deploy_test.sh

  website:
    name: Website Node 24 checks and Chromium E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Install locked dependencies
        working-directory: website
        run: npm ci
      - name: Runtime dependency audit (blocking)
        working-directory: website
        run: npm audit --omit=dev
      - name: Full dependency audit (reported)
        working-directory: website
        continue-on-error: true
        run: npm audit
      - name: Test
        working-directory: website
        run: npm test
      - name: Verify production build
        working-directory: website
        run: npm run build:verify
      - name: Install Playwright Chromium
        working-directory: website
        run: npx playwright install --with-deps chromium
      - name: End-to-end tests
        working-directory: website
        run: npm run test:e2e
