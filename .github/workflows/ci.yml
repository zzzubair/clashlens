name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer pull request push cancels the older run. Main pushes and manual runs
# get one group per commit and never cancel, so every main commit finishes.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  python-tests:
    name: Python PostgreSQL tests, group ${{ matrix.group }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        group: [1, 2, 3, 4]
    # One locked environment for every uv step in this job: sync, Ruff,
    # compile, and the tests must all resolve the same environment.
    env:
      CLASHLENS_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/clashlens
      UV_PROJECT_ENVIRONMENT: /tmp/clashlens-ci-venv
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: clashlens
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d clashlens"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Sync locked dependencies
        working-directory: python
        run: uv sync --locked
      - name: Ruff
        working-directory: python
        run: uv run ruff check . ../development/*.py
      - name: Compile
        working-directory: python
        run: uv run python -m compileall -q src
      - name: Tests
        working-directory: python
        env:
          CLASHLENS_TEST_GROUP: ${{ matrix.group }}
        run: uv run pytest -q --durations=30
      - name: Development service tests
        if: matrix.group == 1
        working-directory: python
        run: |
          PYTHONPATH=.. uv run pytest -q ../development/test_fixtures.py

  python:
    name: Python lint, compile, and PostgreSQL tests
    if: always()
    needs: python-tests
    runs-on: ubuntu-latest
    steps:
      - name: Require all four Python test groups to pass
        env:
          RESULT: ${{ needs.python-tests.result }}
        run: test "$RESULT" = success

  website:
    name: Website Node 24 checks and Chromium E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Install locked dependencies
        working-directory: website
        run: npm ci
      - name: Runtime dependency audit (blocking)
        working-directory: website
        run: npm audit --omit=dev
      - name: Full dependency audit (reported)
        working-directory: website
        continue-on-error: true
        run: npm audit
      - name: Test
        working-directory: website
        run: npm test
      - name: Install rootless Podman
        working-directory: website
        run: sudo apt-get update && sudo apt-get install -y podman
      - name: Install Chromium
        working-directory: website
        run: npx playwright install --with-deps chromium
      - name: Production build and development stack browser tests
        working-directory: website
        run: npm run test:e2e
      - name: Clean up browser test stack
        if: always()
        # Playwright normally sends SIGTERM to dev e2e-server. Also remove
        # this job's stack if startup or runner cancellation interrupted it.
        run: |
          command -v podman >/dev/null || exit 0
          repo_key=$(printf '%s' "$GITHUB_WORKSPACE" | sha256sum | cut -c1-10)
          project="clashlens-dev-$repo_key-e2e"
          if podman pod exists "$project"; then
            podman pod rm --force "$project"
          fi
          for suffix in postgres-data archive-data spool; do
            if podman volume exists "$project-$suffix"; then
              podman volume rm "$project-$suffix"
            fi
          done

  containers:
    name: Container packaging and runtime checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install rootless Podman
        run: sudo apt-get update && sudo apt-get install -y podman
      - name: Build Python check container
        run: podman build --file development/PythonCheck.Containerfile --tag clashlens-python-check:ci .
      - name: Verify packaged operations and support wrappers
        run: |
          podman run --rm --tmpfs /tmp:rw,mode=1777 clashlens-python-check:ci \
            uv run --locked pytest -q tests/test_ops_backup.py tests/test_support_wrapper.py

  packaged-python-tests:
    name: Packaged Python tests, group ${{ matrix.group }}
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        group: [1, 2, 3, 4]
    # Same database image and test database as the development stack, but one
    # server per group and no collector load beside the tests.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: clashlens_test
          POSTGRES_PASSWORD: clashlens-dev
          POSTGRES_USER: clashlens
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U clashlens -d clashlens_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Install rootless Podman
        run: sudo apt-get update && sudo apt-get install -y podman
      - name: Build Python check container
        run: podman build --file development/PythonCheck.Containerfile --tag clashlens-python-check:ci .
      - name: Packaged lint, compile, and development service tests
        if: matrix.group == 1
        run: |
          podman run --rm --tmpfs /tmp:rw,mode=1777 clashlens-python-check:ci sh -c \
            'uv run ruff check . ../development/*.py && uv run python -m compileall -q src ../development && uv run pytest -q ../development/test_fixtures.py'
      - name: Packaged tests
        run: |
          podman run --rm --network host --tmpfs /tmp:rw,mode=1777 \
            --env CLASHLENS_TEST_DATABASE_URL='postgresql://clashlens:clashlens-dev@127.0.0.1:5432/clashlens_test?sslmode=disable' \
            --env CLASHLENS_TEST_GROUP='${{ matrix.group }}' \
            clashlens-python-check:ci uv run pytest -q --durations=30

  packaged-python:
    name: Packaged Python tests
    if: always() && github.event_name != 'pull_request'
    needs: packaged-python-tests
    runs-on: ubuntu-latest
    steps:
      - name: Require all four packaged Python test groups to pass
        env:
          RESULT: ${{ needs.packaged-python-tests.result }}
        run: test "$RESULT" = success

  container-runtime:
    name: Full development container checks
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install rootless Podman
        run: sudo apt-get update && sudo apt-get install -y podman
      - name: Full development container checks
        run: ./dev check
